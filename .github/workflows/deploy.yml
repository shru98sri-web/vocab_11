name: Deploy Flutter web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build web app
        env:
          VOCAB_API_URL: ${{ vars.VOCAB_API_URL }}
        run: |
          VOCAB_OFFLINE=false
          if [ -z "$VOCAB_API_URL" ]; then
            VOCAB_API_URL="http://127.0.0.1:8000"
            echo "::warning::VOCAB_API_URL is unset; building in offline mode with bundled vocabulary."
          fi
          case "$VOCAB_API_URL" in
            https://*) ;;
            http://127.0.0.1:8000)
              VOCAB_OFFLINE=true
              echo "::notice::Using bundled vocabulary because no public backend is configured."
              ;;
            *)
              echo "::error::VOCAB_API_URL must use HTTPS, or be exactly http://127.0.0.1:8000 for local testing."
              exit 1
              ;;
          esac
          flutter build web --release \
            --base-href "/${GITHUB_REPOSITORY#*/}/" \
            --dart-define="VOCAB_URL=$VOCAB_API_URL" \
            --dart-define="VOCAB_OFFLINE=$VOCAB_OFFLINE"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
