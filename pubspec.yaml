name: voca_11

description: "A clean vocabulary builder with AI and ML."
publish_to: none

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & State
  cupertino_icons: ^2.0.0
  google_fonts: ^9.0.0
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  lottie: ^3.1.2
  fl_chart: ^1.3.0
  responsive_framework: ^1.5.1
  carousel_slider: ^5.0.0

  # Firebase (Use current unified versions or Firebase BOM)
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_app_check: ^0.5.1
  firebase_messaging: ^17.0.1
  firebase_crashlytics: any
  audioplayers: any
  camera: any
  file_saver: any
  flutter_email_sender: any


  # AI & ML (Modern, matching SDK)
  google_generative_ai: ^0.4.6
  google_ml_kit: ^0.23.1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2
  ml_algo: any
  ml_dataframe: any


  # Audio & Media (Keep only ONE audio engine to avoid native Gradle duplication)
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  permission_handler: ^13.0.2
  geolocator: ^14.0.1
  quickalert: ^1.1.0

  # Network & Utils
  http: ^1.2.2
  dio: ^5.7.0
  fluttertoast: ^10.0.2
  pdf: ^3.10.4
  printing: ^5.11.1
  share_plus: ^13.3.1
  sqflite: ^2.4.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0


  # --- REQUIRED FOR LOCAL NOTIFICATIONS ---
  flutter_local_notifications: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/icon/Logo.png
    - assets/icon/Splash_Screen.png
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  remove_alpha_ios: true
  image_path: "assets/icon/Logo.png" # अ‍ॅसेट्सच्या पाथशी जुळणारा पाथ ठेवा
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/Logo.png"
    background_color: "#ffffff" # वास्तविक हेक्स कोड टाका
    theme_color: "#01579b"      # वास्तविक हेक्स कोड टाका
  windows:
    generate: true
    image_path: "assets/icon/Logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon/Logo.png"


flutter_native_splash:
  color: "#ffffff"               # Background color of splash screen
  image: "assets/icon/Splash_Screen.png" # Path to your logo asset

  android_12:
    image: "assets/icon/Splash_Screen.png"
    color: "#ffffff"

  web: false

dependency_overrides:
  archive: ^4.3.0
